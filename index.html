<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Zone</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">
        <h1>🎮 GAME ZONE</h1>

        <p>Нажми START и проверь свою реакцию!</p>

        <button id="startButton">START</button>

        <div class="game-area" id="gameArea"></div>

        <div class="stats">

            <div class="stat">
                <span>🎯</span>
                <small>SCORE</small>
                <strong id="score">0</strong>
            </div>

            <div class="stat">
                <span>🏆</span>
                <small>BEST</small>
                <strong id="bestScore">0</strong>
            </div>

            <div class="stat">
                <span>🔥</span>
                <small>LEVEL</small>
                <strong id="level">1</strong>
            </div>

            <div class="stat">
                <span>⏱️</span>
                <small>TIME</small>
                <strong id="timer">15</strong>
            </div>

        </div>
    </div>
    <div class="game-over" id="gameOver">

        <div class="game-over-card">

            <div class="game-over-icon">🎮</div>

            <h2>GAME OVER</h2>

            <p>Отличная игра!</p>

            <div class="results">

                <div class="result">
                    <span>SCORE</span>
                    <strong id="finalScore">0</strong>
                </div>

                <div class="result">
                    <span>BEST</span>
                    <strong id="finalBest">0</strong>
                </div>

                <div class="result">
                    <span>LEVEL</span>
                    <strong id="finalLevel">1</strong>
                </div>

            </div>

            <button id="playAgainButton">
                PLAY AGAIN
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
