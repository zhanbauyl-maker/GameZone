<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QAZAQ HEROES</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <header class="top">
            <div class="logo">🇰🇿 QAZAQ HEROES</div>
            <div class="subtitle">Ұлы даланың қаһармандары</div>
        </header>

        <main class="menu">

            <h1>ҰЛЫ ДАЛАНЫҢ<br>ҚАҺАРМАНДАРЫ</h1>

            <p>
                Тарихи тұлғаларды таңда,
                шайқастарға қатыс және өз қаһарманыңды күшейт!
            </p>

            <button onclick="startGame()">
                ⚔️ ОЙЫНДЫ БАСТАУ
            </button>

            <button class="secondary" onclick="showHeroes()">
                👑 КЕЙІПКЕРЛЕР
            </button>

        </main>

        <footer>
            QAZAQ HEROES • GameZone
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
